name: Build firmware + games for M5StickC Plus2

on:
  push:
    branches: [main]
    paths: ["games/**", "firmware/**", "infrared/**", ".github/workflows/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # trollmaster419/Flipper-Zero-ESP32-Port commit that firmware/plus2.patch is made against
  FW_REPO: https://github.com/trollmaster419/Flipper-Zero-ESP32-Port
  FW_COMMIT: f2e9abed58e2a8dd8a2aa6413cb9fb1710d494bb

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Get the Plus2 firmware at the pinned commit + apply our changes
        run: |
          git init -q fw && cd fw
          git fetch -q --depth 1 "$FW_REPO" "$FW_COMMIT" && git checkout -q FETCH_HEAD
          git apply --binary ../firmware/plus2.patch
          cp -r ../games/* applications_user/

      - name: Build full firmware (App Store, Games menu, AC On, game pack)
        working-directory: fw
        env:
          FLIPPER_BOARD: m5stickcplus2
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 set-target esp32
          idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 build

      - name: Build every game as a .fap (for the App Store)
        run: |
          . $IDF_PATH/export.sh
          rm -rf apps && mkdir -p apps
          for g in games/*/; do
            id=$(basename "$g")
            cat=$(grep -o 'fap_category="[^"]*"' "$g/application.fam" | cut -d'"' -f2)
            mkdir -p "apps/${cat:-Games}"
            (cd fw && bash ./buildFap.sh "$GITHUB_WORKSPACE/$g")
            cp "fw/build_esp32/fap/$id.fap" "apps/${cat:-Games}/"
          done
          python3 tools/make_manifest.py

      - name: Collect firmware for the web flasher
        shell: bash
        run: |
          B=fw/build_esp32
          mkdir -p docs/firmware
          find $B -maxdepth 2 -name '*.bin' -printf '%s %p\n'
          cp $B/bootloader/bootloader.bin $B/partition_table/partition-table.bin $B/furi_esp32.bin docs/firmware/
          python3 tools/make_flasher_manifest.py "${GITHUB_SHA::7}"

      - name: Publish apps/ + Manifest + docs/firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps Manifest docs/firmware
          git diff --cached --quiet || git commit -m "chore: build firmware + games [skip ci]"
          git push
