name: Build firmware + games for M5StickC Plus2

on:
  push:
    branches: [main]
    paths: ["games/**", "firmware/**", "infrared/**", "badusb/**", ".github/workflows/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # trollmaster419/Flipper-Zero-ESP32-Port commit that firmware/plus2.patch is made against
  FW_REPO: https://github.com/trollmaster419/Flipper-Zero-ESP32-Port
  FW_COMMIT: f2e9abed58e2a8dd8a2aa6413cb9fb1710d494bb
  # crankyoldgit/IRremoteESP8266 commit the AC brand table is generated from
  IRAC_COMMIT: 1e2f0f3ef0a93cbf2a8ddb2e95130f8f4c584b3f

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Get the Plus2 firmware at the pinned commit + apply our changes
        run: |
          git init -q fw && cd fw
          git fetch -q --depth 1 "$FW_REPO" "$FW_COMMIT" && git checkout -q FETCH_HEAD
          git apply --binary ../firmware/plus2.patch
          cp -r ../games/* applications_user/
          # AC Full Control: IRremoteESP8266 (LGPL-2.1) AC encoders + generated brand table
          git clone -q https://github.com/crankyoldgit/IRremoteESP8266 components/irac/lib
          git -C components/irac/lib checkout -q "$IRAC_COMMIT"
          python3 ../tools/gen_ac_table.py components/irac/lib components/irac

      - name: Build full firmware (App Store, Games menu, AC On, game pack)
        working-directory: fw
        shell: bash
        env:
          FLIPPER_BOARD: m5stickcplus2
        run: |
          . $IDF_PATH/export.sh
          python -m pip install -q pillow  # icon conversion for the Bluetooth Remote assets
          idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 set-target esp32
          set -o pipefail
          # errors become public annotations (run logs need a login to read)
          if ! idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 build 2>&1 | tee build.log; then
            grep -E "error:|Error:|undefined reference|overflow|too small|does not fit" build.log \
              | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          fi
          # where the flash goes (to find space for new features)
          idf.py -B build_esp32 size > ../size-total.txt 2>&1 || true
          idf.py -B build_esp32 size-components > ../size-components.txt 2>&1 || true
          # what the linker map attributes to libesp_app_format (size report shows ~300 KB)
          { grep -n -B1 -A1 "libesp_app_format.a" build_esp32/furi_esp32.map | head -120;
            echo "--- biggest .rodata input sections ---";
            awk '/^ \.rodata/ && NF>=3 {print}' build_esp32/furi_esp32.map | sort -k3 -r | head -5;
          } > ../appformat-map.txt 2>&1 || true
          grep -iE "total image size|flash code|flash rodata" ../size-total.txt | sed 's/^/::notice::/' || true

      - name: Build every game as a .fap (for the App Store)
        run: |
          . $IDF_PATH/export.sh
          rm -rf apps && mkdir -p apps
          for g in games/*/; do
            id=$(basename "$g")
            cat=$(grep -o 'fap_category="[^"]*"' "$g/application.fam" | cut -d'"' -f2)
            mkdir -p "apps/${cat:-Games}"
            # a FAP calling a function the firmware doesn't export won't load on the stick
            (cd fw && bash ./buildFap.sh "$GITHUB_WORKSPACE/$g") 2>&1 | tee fap.log
            if grep -q "missing API symbols" fap.log; then
              grep -A20 "missing API symbols" fap.log | sed "s/^/::error::$id: /"; exit 1
            fi
            cp "fw/build_esp32/fap/$id.fap" "apps/${cat:-Games}/"
          done
          python3 tools/make_manifest.py

      - name: Collect firmware for the web flasher
        shell: bash
        run: |
          B=fw/build_esp32
          mkdir -p docs/firmware
          find $B -maxdepth 2 -name '*.bin' -printf '%s %p\n'
          cp $B/bootloader/bootloader.bin $B/partition_table/partition-table.bin $B/furi_esp32.bin docs/firmware/
          python3 tools/make_flasher_manifest.py "${GITHUB_SHA::7}"
          cat size-total.txt size-components.txt > firmware/size-report.txt 2>/dev/null || true
          cp appformat-map.txt firmware/appformat-map.txt 2>/dev/null || true

      - name: Publish apps/ + Manifest + docs/firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps Manifest docs/firmware firmware/size-report.txt firmware/appformat-map.txt
          git diff --cached --quiet || git commit -m "chore: build firmware + games [skip ci]"
          git push
