name: Build games for M5StickC Plus2

on:
  push:
    branches: [main]
    paths: ["games/**", ".github/workflows/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get the M5StickC Plus2 firmware (needed for headers + config)
        run: git clone --depth 1 https://github.com/trollmaster419/Flipper-Zero-ESP32-Port fw

      - name: Generate Plus2 firmware config (FAPs only need build_esp32/config)
        working-directory: fw
        env:
          FLIPPER_BOARD: m5stickcplus2
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 set-target esp32
          idf.py -B build_esp32 -DFLIPPER_BOARD=m5stickcplus2 reconfigure

      - name: Build every game as a .fap
        run: |
          . $IDF_PATH/export.sh
          rm -rf apps/Games && mkdir -p apps/Games
          for g in games/*/; do
            id=$(basename "$g")
            (cd fw && bash ./buildFap.sh "$GITHUB_WORKSPACE/$g")
            cp "fw/build_esp32/fap/$id.fap" apps/Games/
          done
          python3 tools/make_manifest.py

      - name: Publish apps/ + Manifest
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps Manifest
          git diff --cached --quiet || git commit -m "Build games [skip ci]"
          git push
